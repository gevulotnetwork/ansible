# ─────────────────────────────────────────────────────────
# Canton node-specific defaults (canton_nodes group only)
# Shared vars (user, paths, postgres, auth) are in group_vars/all/common.yml
# ─────────────────────────────────────────────────────────
zenith_evm_dist_dir: "{{ playbook_dir }}/../../zenith-evm/dist"
canton_version: "3.6.0"
canton_edition: "open-source"
canton_java_xmx: 2g

# Storage
canton_participant_storage_type: postgres
canton_sequencer_mediator_storage_type: postgres
canton_sequencer_type: BFT

# ─────────────────────────────────────────────────────────
# Explorer faucet
# ─────────────────────────────────────────────────────────
canton_evm_explorer_faucet_private_key: "0xfddd908a2ae26924cdc10cf06b3e437470684ba7de654fb6014f6cf19b303559"
canton_evm_explorer_faucet_wctn_address: "0x5594a2bb5e4b0929206187546030d64b027cac37"

# ─────────────────────────────────────────────────────────
# PostgreSQL databases to create
# ─────────────────────────────────────────────────────────
canton_postgres_databases:
  - sequencer1
  - mediator1
  - participant1
  - participant2
  - participant3
  - canton_evm_final

# ─────────────────────────────────────────────────────────
# Canton participants to deploy
# ─────────────────────────────────────────────────────────
canton_participants:
  - name: participant1
    description: "Validator1 - Signatory with Zenith EVM"
    config_file: participant1.conf
    admin_api_port: 5012
    ledger_api_port: 5011
    http_ledger_api_port: 5013
    metrics_port: 5014
    extension:
      name: zenith-evm
      display_name: "Zenith EVM Execution Service"
      host: "127.0.0.1"
      port: 1606
      declared_functions:
        - { function_id: "build-block", config_hash: "" }
        - { function_id: "get-header", config_hash: "" }
        - { function_id: "get-receipt", config_hash: "" }

  - name: participant2
    description: "Validator2 - Signatory with Zenith EVM"
    config_file: participant2.conf
    admin_api_port: 5022
    ledger_api_port: 5021
    http_ledger_api_port: 5023
    metrics_port: 5024
    extension:
      name: zenith-evm
      display_name: "Zenith EVM Execution Service"
      host: "127.0.0.1"
      port: 1607
      declared_functions:
        - { function_id: "build-block", config_hash: "" }
        - { function_id: "get-header", config_hash: "" }
        - { function_id: "get-receipt", config_hash: "" }

  - name: participant3
    description: "Validator3 - Signatory with Zenith EVM"
    config_file: participant3.conf
    admin_api_port: 5032
    ledger_api_port: 5031
    http_ledger_api_port: 5033
    metrics_port: 5034
    extension:
      name: zenith-evm
      display_name: "Zenith EVM Execution Service"
      host: "127.0.0.1"
      port: 1608
      declared_functions:
        - { function_id: "build-block", config_hash: "" }
        - { function_id: "get-header", config_hash: "" }
        - { function_id: "get-receipt", config_hash: "" }

# ─────────────────────────────────────────────────────────
# Canton network topology
# ─────────────────────────────────────────────────────────
canton_network:
  sequencer_mediator:
    host: canton-test-01
    address: "127.0.0.1"
    public_api_port: 5008
    admin_api_port: 5009
    mediator_admin_api_port: 5007

  participants:
    participant1:
      host: canton-test-01
      address: "127.0.0.1"
      description: "Validator1 - Signatory"
      admin_api_port: 5012
      ledger_api_port: 5011
      http_ledger_api_port: 5013

    participant2:
      host: canton-test-01
      address: "127.0.0.1"
      description: "Validator2 - Signatory"
      admin_api_port: 5022
      ledger_api_port: 5021
      http_ledger_api_port: 5023

    participant3:
      host: canton-test-01
      address: "127.0.0.1"
      description: "Validator3 - Signatory"
      admin_api_port: 5032
      ledger_api_port: 5031
      http_ledger_api_port: 5033

# ─────────────────────────────────────────────────────────
# Zenith services
# ─────────────────────────────────────────────────────────
zenith_block_builders:
  - id: 1
    http_port: 32998
    authrpc_port: 9551
    p2p_port: 30403
    metrics_port: 6300
    trusted_peers:
      - "enode://{{ bb2_enode_pubkey }}@127.0.0.1:30404"
      - "enode://{{ bb3_enode_pubkey }}@127.0.0.1:30406"

  - id: 2
    http_port: 32999
    authrpc_port: 9552
    p2p_port: 30404
    metrics_port: 6301
    trusted_peers:
      - "enode://{{ bb1_enode_pubkey }}@127.0.0.1:30403"
      - "enode://{{ bb3_enode_pubkey }}@127.0.0.1:30406"

  - id: 3
    http_port: 33000
    authrpc_port: 9554
    p2p_port: 30406
    metrics_port: 6302
    trusted_peers:
      - "enode://{{ bb1_enode_pubkey }}@127.0.0.1:30403"
      - "enode://{{ bb2_enode_pubkey }}@127.0.0.1:30404"

zenith_ecs_servers:
  - id: 1
    port: 1606
    block_builder_port: 32998

  - id: 2
    port: 1607
    block_builder_port: 32999

  - id: 3
    port: 1608
    block_builder_port: 33000

zenith_headcasters:
  - id: 1
    rpc_port: 32998               # block-builder-1 HTTP RPC
    listen_port: 9000             # libp2p listen
    canton_endpoint: "http://127.0.0.1:5011"  # participant1 ledger API
    engine_url: "http://127.0.0.1:9551"       # block-builder-1 authrpc (Engine API)
    engine_jwt_file: "%h/zenith/data/relayer-1/jwt.hex"

  - id: 2
    rpc_port: 32999               # block-builder-2 HTTP RPC
    listen_port: 9001             # libp2p listen
    canton_endpoint: "http://127.0.0.1:5021"  # participant2 ledger API
    engine_url: "http://127.0.0.1:9552"       # block-builder-2 authrpc (Engine API)
    engine_jwt_file: "%h/zenith/data/relayer-2/jwt.hex"

  - id: 3
    rpc_port: 32998               # block-builder-1 HTTP RPC (fetch block payloads)
    listen_port: 9002             # libp2p listen
    canton_endpoint: "http://127.0.0.1:5011"  # participant1 ledger API
    engine_url: "http://127.0.0.1:9553"       # sequencer authrpc (Engine API)
    engine_jwt_file: "%h/zenith/data/sequencer-1/jwt.hex"

  - id: 4
    rpc_port: 33000               # block-builder-3 HTTP RPC
    listen_port: 9003             # libp2p listen
    canton_endpoint: "http://127.0.0.1:5031"  # participant3 ledger API
    engine_url: "http://127.0.0.1:9554"       # block-builder-3 authrpc (Engine API)
    engine_jwt_file: "%h/zenith/data/relayer-3/jwt.hex"

zenith_sequencers:
  - id: 1
    http_port: 9200
    authrpc_port: 9553                      # Engine API for headcaster-3
    p2p_port: 30405                         # p2p sync from block-builders
    metrics_port: 6310
    validator_id: 1                         # maps to ZENITH_VALIDATOR1_PARTY env var
    canton_ledger_api_port: 5011            # participant1 ledger API
    trusted_peers:                          # block-builders for p2p sync recovery
      - "enode://{{ bb1_enode_pubkey }}@127.0.0.1:30403"

zenith_validators:
  - id: 1
    validator_id: 1                         # maps to ZENITH_VALIDATOR1_PARTY env var
    canton_ledger_api_port: 5011            # participant1 ledger API
    block_time: 5
    proposer: true                          # only Validator1 finalizes blocks
    observers: [1]                          # sequencer (Validator1) needs to be observer

  - id: 2
    validator_id: 2                         # maps to ZENITH_VALIDATOR2_PARTY env var
    canton_ledger_api_port: 5021            # participant2 ledger API
    block_time: 5
    observers: [1]

  - id: 3
    validator_id: 3                         # maps to ZENITH_VALIDATOR3_PARTY env var
    canton_ledger_api_port: 5031            # participant3 ledger API
    block_time: 5
    observers: [1]
