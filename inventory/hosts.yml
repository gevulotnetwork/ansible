all:
  children:
    # ─────────────────────────────────────────────────────────
    # Functional groups — what a host runs
    # ─────────────────────────────────────────────────────────
    canton_nodes:
      children:
        canton_sequencers:
          hosts:
            canton-test-01:
            canton-devnet-01:

        canton_participants:
          hosts:
            canton-test-01:
            canton-devnet-01:

    explorer_nodes:
      hosts:
        canton-explorer:

    # ─────────────────────────────────────────────────────────
    # Network groups — which chain a host belongs to.
    # Per-network config lives in inventory/group_vars/{testnet,devnet}/.
    # To move a host between networks, move it between these groups.
    # ─────────────────────────────────────────────────────────
    testnet:
      hosts:
        canton-test-01:
        canton-explorer:

    devnet:
      hosts:
        canton-devnet-01:
