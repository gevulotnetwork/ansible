cloudflared_tunnels:
  - name: cloudflared
    token: "{{ cloudflared_tunnel_token }}"
    after: canton-evm-explorer.service
    wanted_by: canton-evm-explorer.target
  - name: cloudflared-rpc
    token: "{{ cloudflared_tunnel_token_rpc }}"
    after: zenith-sequencer-1.service
    wanted_by: zenith.target

# Sequencer-Mediator ports
canton_sequencer_mediator_config: sequencer-mediator.conf
canton_sequencer_public_api_port: 5008
canton_sequencer_admin_api_port: 5009
canton_mediator_admin_api_port: 5007

# Firewall — allow explorer VM to reach Ledger API + Sequencer RPC
firewall_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 443, proto: tcp, comment: "HTTPS / gRPC proxy" }
  - { port: 5013, proto: tcp, from: "10.156.0.0/20", comment: "Canton HTTP Ledger API (explorer)" }
  - { port: 9200, proto: tcp, comment: "Zenith Sequencer RPC" }

# All services on this host (for Vector / monitoring)
canton_services:
  - name: canton-postgres
    type: postgres
  - name: canton-sequencer-mediator
    type: sequencer-mediator
    metrics_port: 5010
  - name: canton-participant1
    type: participant
    metrics_port: 5014
  - name: canton-participant2
    type: participant
    metrics_port: 5024
  - name: canton-participant3
    type: participant
    metrics_port: 5034
  - name: canton-network-setup
    type: setup
  - name: zenith-deploy-contract
    type: setup
  - name: zenith-block-builder-1
    type: block-builder
    metrics_port: 6300
  - name: zenith-block-builder-2
    type: block-builder
    metrics_port: 6301
  - name: zenith-block-builder-3
    type: block-builder
    metrics_port: 6302
  - name: zenith-ecs-1
    type: ecs
  - name: zenith-ecs-2
    type: ecs
  - name: zenith-ecs-3
    type: ecs
  - name: zenith-headcaster-1
    type: headcaster
  - name: zenith-headcaster-2
    type: headcaster
  - name: zenith-headcaster-3
    type: headcaster
  - name: zenith-headcaster-4
    type: headcaster
  - name: zenith-sequencer-1
    type: sequencer
    metrics_port: 6310
  - name: zenith-validator-1
    type: validator
  - name: zenith-validator-2
    type: validator
  - name: zenith-validator-3
    type: validator
  - name: canton-evm-explorer-indexer
    type: explorer
  - name: canton-evm-explorer
    type: explorer
  - name: cloudflared
    type: tunnel
