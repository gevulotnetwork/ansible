- name: Check if Vector is already installed
  ansible.builtin.command:
    cmd: vector --version
  register: _vector_installed
  changed_when: false
  failed_when: false

- name: Install Vector from GitHub release
  when: _vector_installed.rc != 0 or ('vector ' + vector_version) not in (_vector_installed.stdout | default(''))
  block:
    - name: Download Vector .deb from GitHub
      ansible.builtin.get_url:
        url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
        dest: "/tmp/vector_{{ vector_version }}_amd64.deb"
        mode: "0644"

    - name: Install Vector .deb
      ansible.builtin.apt:
        deb: "/tmp/vector_{{ vector_version }}_amd64.deb"

    - name: Clean up .deb file
      ansible.builtin.file:
        path: "/tmp/vector_{{ vector_version }}_amd64.deb"
        state: absent

- name: Install prometheus-node-exporter
  ansible.builtin.package:
    name: prometheus-node-exporter
    state: present

- name: Enable and start node-exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Remove stale apt repo (if present)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vector.sources
    state: absent

- name: Deploy Vector systemd service
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vector
