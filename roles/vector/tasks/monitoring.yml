- name: Show config file path
  ansible.builtin.debug:
    msg: "Copying config file: {{ vector_base_dir }}/vector.toml"

- name: Ensure Vector data directory exists
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: vector
    group: vector
    mode: "0755"

- name: Copy config file
  ansible.builtin.template:
    src: "vector.toml.j2"
    dest: "{{ vector_base_dir }}/vector.toml"
    mode: "0644"
  notify:
    - Restart vector
