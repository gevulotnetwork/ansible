- name: Look up canton user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ canton_user | default('canton') }}"

- name: Set canton_uid fact
  ansible.builtin.set_fact:
    canton_uid: "{{ getent_passwd[canton_user | default('canton')][1] }}"

- name: Show config file path
  ansible.builtin.debug:
    msg: "Copying config file: {{ vector_base_dir }}/vector.toml (canton UID: {{ canton_uid }})"

- name: Ensure Vector data directory exists
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: vector
    group: vector
    mode: "0755"

- name: Copy config file
  ansible.builtin.template:
    src: "vector.toml.j2"
    dest: "{{ vector_base_dir }}/vector.toml"
    mode: "0644"
  notify:
    - Restart vector

- name: Enable and start Vector service
  ansible.builtin.systemd_service:
    name: vector
    enabled: true
    state: started
