- name: Deploy zenith-relayer user services
  ansible.builtin.template:
    src: zenith-relayer.service.j2
    dest: "{{ canton_systemd_dir }}/zenith-relayer-{{ relayer.id }}.service"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  loop: "{{ zenith_relayers }}"
  loop_control:
    loop_var: relayer
  notify:
    - reload user systemd

- name: Reload user systemd daemon
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"

- name: Enable zenith-relayer services
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user enable zenith-relayer-{{ relayer.id }}.service"
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop: "{{ zenith_relayers }}"
  loop_control:
    loop_var: relayer

- name: Restart zenith-relayer services if binaries changed
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user restart zenith-relayer-{{ relayer.id }}.service"
  when: zenith_binaries_changed | default(false)
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop: "{{ zenith_relayers }}"
  loop_control:
    loop_var: relayer
