- name: Create block-builder relayer directories
  ansible.builtin.file:
    path: "{{ zenith_data_dir }}/relayer-{{ bb.id }}"
    state: directory
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0755"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Create block-builder data directories
  ansible.builtin.file:
    path: "{{ zenith_data_dir }}/block-builder-{{ bb.id }}"
    state: directory
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0755"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Copy existing discovery-secret to p2p.key if present
  ansible.builtin.copy:
    src: "{{ zenith_data_dir }}/block-builder-{{ bb.id }}/discovery-secret"
    dest: "{{ zenith_data_dir }}/block-builder-{{ bb.id }}/p2p.key"
    remote_src: true
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0600"
    force: false
  become: true
  become_user: "{{ canton_user }}"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb
  ignore_errors: true

- name: Generate p2p secret key for block-builder (if no existing key)
  ansible.builtin.shell:
    cmd: "openssl rand -hex 32 > {{ zenith_data_dir }}/block-builder-{{ bb.id }}/p2p.key"
    creates: "{{ zenith_data_dir }}/block-builder-{{ bb.id }}/p2p.key"
  become: true
  become_user: "{{ canton_user }}"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Generate JWT secret for block-builder authrpc
  ansible.builtin.shell:
    cmd: "openssl rand -hex 32 > {{ zenith_data_dir }}/relayer-{{ bb.id }}/jwt.hex"
    creates: "{{ zenith_data_dir }}/relayer-{{ bb.id }}/jwt.hex"
  become: true
  become_user: "{{ canton_user }}"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Deploy block-builder genesis.json (Cancun, no Prague)
  ansible.builtin.copy:
    src: genesis.json
    dest: "{{ zenith_etc_dir }}/genesis.json"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  register: genesis_changed

- name: Deploy zenith-block-builder user services
  ansible.builtin.template:
    src: zenith-block-builder.service.j2
    dest: "{{ canton_systemd_dir }}/zenith-block-builder-{{ bb.id }}.service"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb
  notify:
    - Reload user systemd

- name: Reload user systemd daemon
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"

- name: Enable zenith-block-builder services
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user enable zenith-block-builder-{{ bb.id }}.service"
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  when: bb_id is not defined or bb.id == (bb_id | int)
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Wipe block-builder data if genesis changed
  ansible.builtin.file:
    path: "{{ zenith_data_dir }}/block-builder-{{ bb.id }}"
    state: absent
  when: (genesis_changed.changed | default(false)) and (bb_id is not defined or bb.id == (bb_id | int))
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb

- name: Restart zenith-block-builder services if binaries changed
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user restart zenith-block-builder-{{ bb.id }}.service"
  changed_when: true
  when: (zenith_evm_binaries_changed | default(false) or genesis_changed.changed | default(false)) and (bb_id is not defined or bb.id == (bb_id | int))
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop: "{{ zenith_block_builders }}"
  loop_control:
    loop_var: bb
