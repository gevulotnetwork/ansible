# canton_dist_dir: must be set in inventory (path to built artifacts)

canton_user: canton
canton_group: canton
canton_user_home: "/home/{{ canton_user }}"
canton_base_dir: "{{ canton_user_home }}/canton"
canton_bin_dir: "{{ canton_base_dir }}/bin"
canton_config_dir: "{{ canton_base_dir }}/configs"
canton_log_dir: "{{ canton_base_dir }}/logs"
canton_lib_dir: "{{ canton_base_dir }}/lib"
canton_dars_dir: "{{ canton_base_dir }}/dars"
canton_scripts_dir: "{{ canton_base_dir }}/scripts"
canton_systemd_dir: "{{ canton_user_home }}/.config/systemd/user"
canton_jar: "{{ canton_lib_dir }}/canton.jar"
canton_java_xmx: 2g
canton_nofile_limit: 65536
canton_nproc_limit: 4096

# Zenith
zenith_base_dir: "{{ canton_user_home }}/zenith"
zenith_bin_dir: "{{ zenith_base_dir }}/bin"
zenith_data_dir: "{{ zenith_base_dir }}/data"
zenith_etc_dir: "{{ zenith_base_dir }}/etc"

# Zenith GitHub releases
zenith_github_repo: zenith-network/zenith-canton
zenith_download_dir: /tmp/zenith-releases
zenith_arch: x86_64-unknown-linux-musl

zenith_relayer_version: "0.1.0"
zenith_node_version: "0.1.0"
zenith_ecs_version: "0.1.0"
zenith_transfer_eth_version: "0.1.0"

zenith_release_assets:
  - name: zenith-relayer
    release_tag: "zenith-relayer-v{{ zenith_relayer_version }}"
    asset: "zenith-relayer-zenith-relayer-v{{ zenith_relayer_version }}-{{ zenith_arch }}.tar.gz"
  - name: zenith-node
    release_tag: "zenith-node-v{{ zenith_node_version }}"
    asset: "zenith-node-zenith-node-v{{ zenith_node_version }}-{{ zenith_arch }}.tar.gz"
  - name: zenith-ecs
    release_tag: "zenith-ecs-v{{ zenith_ecs_version }}"
    asset: "zenith-ecs-zenith-ecs-v{{ zenith_ecs_version }}-{{ zenith_arch }}.tar.gz"
  - name: transfer-eth
    release_tag: "eth-utils-v{{ zenith_transfer_eth_version }}"
    asset: "transfer-eth-eth-utils-v{{ zenith_transfer_eth_version }}-{{ zenith_arch }}.tar.gz"
