canton_user: canton
canton_group: canton
canton_user_home: "/home/{{ canton_user }}"
canton_base_dir: "{{ canton_user_home }}/canton"
canton_bin_dir: "{{ canton_base_dir }}/bin"
canton_config_dir: "{{ canton_base_dir }}/configs"
canton_log_dir: "{{ canton_base_dir }}/logs"
canton_lib_dir: "{{ canton_base_dir }}/lib"
canton_dars_dir: "{{ canton_base_dir }}/dars"
canton_scripts_dir: "{{ canton_base_dir }}/scripts"
canton_systemd_dir: "{{ canton_user_home }}/.config/systemd/user"
canton_jar: "{{ canton_lib_dir }}/canton.jar"
canton_java_xmx: 2g
canton_nofile_limit: 65536
canton_nproc_limit: 4096

# Zenith
zenith_base_dir: "{{ canton_user_home }}/zenith"
zenith_bin_dir: "{{ zenith_base_dir }}/bin"
zenith_data_dir: "{{ zenith_base_dir }}/data"
zenith_etc_dir: "{{ zenith_base_dir }}/etc"

# Zenith EVM releases (all binaries from zenith-network/zenith-evm)
zenith_evm_github_repo: zenith-network/zenith-evm
zenith_download_dir: /tmp/zenith-releases
zenith_evm_arch: x86_64-unknown-linux-gnu

block_builder_version: "0.1.2"
zenith_ecs_version: "0.1.2"
headcaster_version: "0.1.2"
sequencer_version: "0.1.3"
validator_version: "0.1.3"

# Canton toolchain (canton.jar, damlc) from GitHub releases
toolchain_version: "0.2.2"
toolchain_release_assets:
  - name: canton.jar
    asset: canton.jar
  - name: damlc.tar.gz
    asset: damlc.tar.gz

zenith_evm_release_assets:
  - name: block-builder-node
    release_tag: "block-builder-node-v{{ block_builder_version }}"
    asset: "block-builder-node-block-builder-node-v{{ block_builder_version }}-{{ zenith_evm_arch }}.tar.gz"
  - name: zenith-ecs
    binary: zenith-evm-ecs
    release_tag: "zenith-ecs-v{{ zenith_ecs_version }}"
    asset: "zenith-evm-ecs-zenith-ecs-v{{ zenith_ecs_version }}-{{ zenith_evm_arch }}.tar.gz"
  - name: headcaster
    release_tag: "headcaster-v{{ headcaster_version }}"
    asset: "headcaster-headcaster-v{{ headcaster_version }}-{{ zenith_evm_arch }}.tar.gz"
  - name: sequencer
    release_tag: "sequencer-v{{ sequencer_version }}"
    asset: "sequencer-sequencer-v{{ sequencer_version }}-{{ zenith_evm_arch }}.tar.gz"
  - name: validator
    release_tag: "validator-v{{ validator_version }}"
    asset: "validator-validator-v{{ validator_version }}-{{ zenith_evm_arch }}.tar.gz"
