- name: Create local download directory for Zenith binaries
  ansible.builtin.file:
    path: "{{ zenith_download_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Download Zenith EVM release tarballs from GitHub
  ansible.builtin.command:
    cmd: >-
      gh release download {{ item.release_tag }}
      --repo {{ zenith_evm_github_repo }}
      --pattern {{ item.asset }}
      --dir {{ zenith_download_dir }}
      --clobber
    creates: "{{ zenith_download_dir }}/{{ item.asset }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ zenith_evm_release_assets }}"
  loop_control:
    label: "{{ item.name }}"
  register: zenith_evm_downloads

- name: Extract Zenith EVM binaries from tarballs
  ansible.builtin.command:
    cmd: "tar xzf {{ zenith_download_dir }}/{{ item.item.asset }} --strip-components=1 -C {{ zenith_download_dir }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ zenith_evm_downloads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.changed or not (zenith_download_dir ~ '/' ~ (item.item.binary | default(item.item.name))) is file

- name: Install Zenith EVM binaries
  ansible.builtin.copy:
    src: "{{ zenith_download_dir }}/{{ item.binary | default(item.name) }}"
    dest: "{{ zenith_bin_dir }}/{{ item.name }}"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0755"
  loop: "{{ zenith_evm_release_assets }}"
  loop_control:
    label: "{{ item.name }}"
  register: zenith_evm_binaries_deployed
