- name: Download Canton toolchain from GitHub
  ansible.builtin.command:
    cmd: >-
      gh release download toolchain-v{{ toolchain_version }}
      --repo {{ zenith_evm_github_repo }}
      --pattern {{ item.asset }}
      --dir {{ zenith_download_dir }}
      --clobber
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ toolchain_release_assets }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy Canton JAR from download
  ansible.builtin.copy:
    src: "{{ zenith_download_dir }}/canton.jar"
    dest: "{{ canton_lib_dir }}/canton.jar"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  register: canton_jar_deployed

- name: Create damlc directory
  ansible.builtin.file:
    path: "{{ canton_bin_dir }}/damlc"
    state: directory
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0755"

- name: Extract damlc from download
  ansible.builtin.unarchive:
    src: "{{ zenith_download_dir }}/damlc.tar.gz"
    dest: "{{ canton_bin_dir }}/damlc"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    creates: "{{ canton_bin_dir }}/damlc/bazel-bin/compiler/damlc/damlc-bootstrap"

- name: Deploy Zenith DAR files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ canton_dars_dir }}/{{ item | basename }}"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  loop:
    - "{{ zenith_evm_dist_dir }}/zenith-evm-0.1.0.dar"
  register: canton_dar_deployed
