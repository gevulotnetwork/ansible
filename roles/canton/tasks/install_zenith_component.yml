- name: "Download and install {{ zenith_component.name }} v{{ zenith_component.version }}"
  vars:
    tag: "{{ zenith_component.name }}-v{{ zenith_component.version }}"
    tarball: "{{ zenith_component.name }}-{{ tag }}-{{ zenith_arch }}.tar.gz"
    extract_dir: "{{ zenith_component.name }}-{{ tag }}-{{ zenith_arch }}"
  block:
    - name: "Download {{ zenith_component.name }} release asset locally"
      ansible.builtin.command:
        cmd: >-
          gh release download {{ tag }}
          --repo zenith-network/zenith-canton
          --pattern {{ tarball }}
          --dir /tmp
          --clobber
      delegate_to: localhost
      become: false

    - name: "Copy and extract {{ zenith_component.name }} tarball to remote"
      ansible.builtin.unarchive:
        src: "/tmp/{{ tarball }}"
        dest: /tmp

    - name: "Install {{ zenith_component.name }} binary"
      ansible.builtin.copy:
        src: "/tmp/{{ extract_dir }}/{{ zenith_component.name }}"
        dest: "{{ zenith_bin_dir }}/{{ zenith_component.name }}"
        owner: "{{ canton_user }}"
        group: "{{ canton_group }}"
        mode: "0755"
        remote_src: true

    - name: "Clean up local tarball"
      ansible.builtin.file:
        path: "/tmp/{{ tarball }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: "Clean up remote extracted file"
      ansible.builtin.file:
        path: "/tmp/{{ extract_dir }}"
        state: absent
