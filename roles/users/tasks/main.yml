- name: Create user to run containers
  ansible.builtin.user:
    name: "{{ user.name }}"
    comment: "Node User"
    uid: "{{ user.uid }}"
    create_home: true
    system: true
    shell: /bin/bash

- name: Check if user is lingering
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ user.name }}"
  register: user_lingering

- name: Enable lingering if needed
  ansible.builtin.command: "loginctl enable-linger {{ user.name }}"
  when: not user_lingering.stat.exists
  changed_when: false

- name: Set users
  ansible.builtin.set_fact:
    subid_users:
      - "{{ user.name }}"

- name: Generate subuids & subgids
  ansible.builtin.include_role:
    name: subuid_subgid

- name: Make sure paths exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true
  loop:
    - "{{ unit_file_path }}"
    - "/run/user/{{ user.uid }}/containers"

- name: Allow root to manage user's dbus service (for systemd)
  ansible.builtin.copy:
    content: |
      <busconfig>
        <policy context="mandatory">
          <allow user="root"/>
        </policy>
      </busconfig>
    dest: /etc/dbus-1/session-local.conf
    mode: "0644"
    owner: root
    group: root

