- name: Get canton user UID
  ansible.builtin.command:
    cmd: "id -u {{ canton_user }}"
  register: canton_uid
  changed_when: false

- name: Ensure explorer database exists
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: >-
      podman exec canton-postgres
      psql -U {{ canton_postgres_user }} -tc
      "SELECT 1 FROM pg_database WHERE datname='{{ canton_evm_explorer_db_name }}'"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  register: explorer_db_check
  changed_when: false

- name: Create explorer database
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: >-
      podman exec canton-postgres
      psql -U {{ canton_postgres_user }} -c
      "CREATE DATABASE {{ canton_evm_explorer_db_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  when: explorer_db_check.stdout.strip() != "1"

- name: Deploy canton-evm-explorer target
  ansible.builtin.template:
    src: canton-evm-explorer.target.j2
    dest: "{{ canton_systemd_dir }}/canton-evm-explorer.target"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  notify:
    - Reload user systemd

- name: Deploy canton-evm-explorer-indexer user service
  ansible.builtin.template:
    src: canton-evm-explorer-indexer.service.j2
    dest: "{{ canton_systemd_dir }}/canton-evm-explorer-indexer.service"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  notify:
    - Reload user systemd

- name: Deploy canton-evm-explorer user service
  ansible.builtin.template:
    src: canton-evm-explorer.service.j2
    dest: "{{ canton_systemd_dir }}/canton-evm-explorer.service"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  notify:
    - Reload user systemd

- name: Reload user systemd daemon
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"

- name: Enable canton-evm-explorer services
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user enable {{ item }}"
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop:
    - canton-evm-explorer.target
    - canton-evm-explorer-indexer
    - canton-evm-explorer

- name: Start canton-evm-explorer services
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user restart canton-evm-explorer-indexer.service canton-evm-explorer.service"
  changed_when: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"

- name: Backfill Canton-EVM correlations
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "podman exec -w /app canton-evm-explorer-indexer npx tsx scripts/backfill-correlations.ts"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  changed_when: true
