canton_evm_explorer_image: "ghcr.io/zenith-network/canton-evm-explorer:latest"
canton_evm_explorer_indexer_image: "ghcr.io/zenith-network/canton-evm-explorer:indexer"
canton_evm_explorer_db_name: "canton_evm_final"
canton_evm_explorer_db_url: "postgresql://{{ canton_postgres_user }}:{{ canton_postgres_password }}@127.0.0.1:{{ canton_postgres_port }}/{{ canton_evm_explorer_db_name }}"
canton_evm_explorer_canton_http_api_url: "http://127.0.0.1:5013"
canton_evm_explorer_evm_rpc_url: "http://127.0.0.1:9200"

# Browser-facing RPC endpoint, served to the UI (MetaMask "add network",
# client-side calls). Distinct from canton_evm_explorer_evm_rpc_url above,
# which is the internal address the server itself dials.
# Defaults to the network's public endpoint; see group_vars/{testnet,devnet}.
# Left empty the env var is omitted entirely rather than leaking an
# internal hostname to browsers.
canton_evm_explorer_public_evm_rpc_url: "{{ network_public_rpc_url | default('') }}"
canton_evm_explorer_chain_id: 936485
canton_evm_explorer_port: 3000

# Network
canton_evm_explorer_default_network: "final-testnet"

# Indexer performance tuning
canton_evm_explorer_canton_page_size: 500
canton_evm_explorer_canton_poll_ms: 500
canton_evm_explorer_correlator_poll_ms: 3000
canton_evm_explorer_evm_batch_size: 500
canton_evm_explorer_evm_poll_ms: 200

# Faucet (disabled when private key is empty)
canton_evm_explorer_faucet_private_key: ""
canton_evm_explorer_faucet_wctn_address: ""
canton_evm_explorer_faucet_zth_amount: 100
canton_evm_explorer_faucet_wctn_amount: 100
canton_evm_explorer_faucet_network_id: "final-testnet"
