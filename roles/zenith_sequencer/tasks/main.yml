- name: Create sequencer data directories
  ansible.builtin.file:
    path: "{{ zenith_data_dir }}/sequencer-{{ sq.id }}"
    state: directory
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0755"
  loop: "{{ zenith_sequencers }}"
  loop_control:
    loop_var: sq

- name: Generate JWT secret for sequencer authrpc
  ansible.builtin.shell:
    cmd: "openssl rand -hex 32 > {{ zenith_data_dir }}/sequencer-{{ sq.id }}/jwt.hex"
    creates: "{{ zenith_data_dir }}/sequencer-{{ sq.id }}/jwt.hex"
  become: true
  become_user: "{{ canton_user }}"
  loop: "{{ zenith_sequencers }}"
  loop_control:
    loop_var: sq
  when: sq.authrpc_port is defined

- name: Deploy zenith-sequencer user services
  ansible.builtin.template:
    src: zenith-sequencer.service.j2
    dest: "{{ canton_systemd_dir }}/zenith-sequencer-{{ sq.id }}.service"
    owner: "{{ canton_user }}"
    group: "{{ canton_group }}"
    mode: "0644"
  loop: "{{ zenith_sequencers }}"
  loop_control:
    loop_var: sq
  notify:
    - Reload user systemd

- name: Reload user systemd daemon
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"

- name: Enable zenith-sequencer services
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user enable zenith-sequencer-{{ sq.id }}.service"
  changed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop: "{{ zenith_sequencers }}"
  loop_control:
    loop_var: sq

- name: Restart zenith-sequencer services if binaries changed
  become: true
  become_user: "{{ canton_user }}"
  ansible.builtin.command:
    cmd: "systemctl --user restart zenith-sequencer-{{ sq.id }}.service"
  changed_when: true
  when: zenith_evm_binaries_changed | default(false)
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
  loop: "{{ zenith_sequencers }}"
  loop_control:
    loop_var: sq
