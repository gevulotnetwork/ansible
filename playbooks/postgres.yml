---
- name: Update Canton PostgreSQL config
  hosts: canton_nodes
  become: true
  pre_tasks:
    - name: Look up canton user UID
      ansible.builtin.command:
        cmd: "id -u {{ canton_user }}"
      register: canton_uid
      changed_when: false
  roles:
    - role: canton_postgres
  post_tasks:
    - name: Restart canton-postgres service
      become_user: "{{ canton_user }}"
      ansible.builtin.command:
        cmd: systemctl --user restart canton-postgres.service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ canton_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ canton_uid.stdout }}/bus"
      changed_when: true
